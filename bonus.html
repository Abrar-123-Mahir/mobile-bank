<!DOCTYPE html>
<html lang="en">

<head>

  <!-- =====================================================
       Document Metadata
       ===================================================== -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Payoo - Get Bonus</title>


  <!-- =====================================================
       DaisyUI
       ===================================================== -->

  <link
    href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css"
    rel="stylesheet"
  >


  <!-- =====================================================
       Tailwind CSS
       ===================================================== -->

  <script src="https://cdn.tailwindcss.com"></script>


  <!-- =====================================================
       Custom CSS
       ===================================================== -->

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body class="bg-slate-100">

  <!-- =====================================================
       Main Application Container
       ===================================================== -->

  <main
    class="phone-shell min-h-screen mx-auto max-w-md bg-slate-100 shadow-xl overflow-hidden"
  >


    <!-- ===================================================
         Page Header
         =================================================== -->

    <header class="page-header">

      <!-- Back Button -->
      <a
        href="home.html"
        class="back-btn"
        aria-label="Go back to home"
      >
        ←
      </a>


      <!-- Page Title -->
      <h1>Get Bonus</h1>


      <!-- Header Spacer -->
      <span></span>

    </header>


    <!-- ===================================================
         Bonus Section
         =================================================== -->

    <section class="px-6 py-6">


      <!-- =================================================
           Bonus Hero
           ================================================= -->

      <div class="bonus-hero">

        <!-- Bonus Icon -->
        <img
          src="assets/icons/get-bonus.png"
          class="mx-auto w-16 h-16 object-contain"
          alt="Get Bonus"
        >


        <!-- Bonus Title -->
        <h2 class="text-2xl font-extrabold mt-3">
          Get ৳50 Bonus
        </h2>


        <!-- Bonus Description -->
        <p class="text-slate-500 mt-1">
          Complete the demo task and claim your bonus.
        </p>


        <!-- Claim Button -->
        <button
          id="claimBonus"
          type="button"
          class="btn btn-primary rounded-full bg-indigo-700 border-0 text-white mt-5"
        >
          Claim Bonus
        </button>


        <!-- Bonus Message -->
        <p
          id="bonusMessage"
          class="text-sm mt-3"
        ></p>

      </div>


      <!-- =================================================
           Bonus Rules
           ================================================= -->

      <div class="form-card mt-5">

        <h3 class="font-bold">
          Bonus Rules
        </h3>


        <ul
          class="list-disc pl-5 text-sm text-slate-500 mt-3 space-y-2"
        >

          <li>
            One demo claim per browser.
          </li>

          <li>
            Bonus is added directly to your wallet balance.
          </li>

          <li>
            Every claim appears in Transaction History.
          </li>

        </ul>

      </div>

    </section>

  </main>


  <!-- =====================================================
       Shared Application JavaScript
       ===================================================== -->

  <script src="js/app.js"></script>


  <!-- =====================================================
       Bonus JavaScript
       ===================================================== -->

  <script src="js/bonus.js"></script>

</body>

</html>
