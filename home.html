<!DOCTYPE html>
<html lang="en">

<head>

  <!-- =====================================================
       Document Metadata
       ===================================================== -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Payoo - Home</title>


  <!-- =====================================================
       DaisyUI
       ===================================================== -->

  <link
    href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css"
    rel="stylesheet"
  >


  <!-- =====================================================
       Tailwind CSS
       ===================================================== -->

  <script src="https://cdn.tailwindcss.com"></script>


  <!-- =====================================================
       Custom CSS
       ===================================================== -->

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body class="bg-slate-100">

  <!-- =====================================================
       Main Application Container
       ===================================================== -->

  <main
    class="phone-shell bg-slate-100 min-h-screen mx-auto max-w-md shadow-xl overflow-hidden"
  >


    <!-- ===================================================
         Top Header
         =================================================== -->

    <header
      class="bg-white px-6 pt-6 pb-5 border-b"
    >

      <div class="flex items-center justify-between">


        <!-- =================================================
             Brand and Balance
             ================================================= -->

        <div class="flex items-center gap-3">

          <!-- Payoo Logo -->
          <div class="brand-mark">

            <span></span>
            <span></span>

          </div>


          <!-- Available Balance -->
          <div>

            <div
              id="balance"
              class="text-xl font-extrabold"
            >
              ৳45,000
            </div>

            <div class="text-xs text-slate-500">
              Available Balance
            </div>

          </div>

        </div>


        <!-- =================================================
             Logout Button
             ================================================= -->

        <button
          id="logoutBtn"
          type="button"
          class="btn btn-sm btn-outline rounded-xl"
        >
          ↪ Log Out
        </button>

      </div>

    </header>


    <!-- ===================================================
         Welcome Section
         =================================================== -->

    <section
      class="bg-white px-6 pt-10 pb-6 rounded-b-[2rem]"
    >

      <h1 class="text-2xl font-extrabold">
        Welcome to Pay<span class="text-indigo-600">oo</span>
      </h1>


      <p class="text-slate-500 mt-3 leading-7">
        Enjoy easy and convenient financial services with us.
        <br>
        Cashout charge is low and
      </p>


      <!-- =================================================
           Service Menu
           ================================================= -->

      <div class="grid grid-cols-3 gap-4 mt-8">


        <!-- Add Money -->
        <a
          class="service-card"
          href="add-money.html"
        >

          <img
            class="service-icon-img"
            src="assets/icons/add-money.png"
            alt="Add Money"
          >

          <span>
            Add Money
          </span>

        </a>


        <!-- Cashout -->
        <a
          class="service-card"
          href="cashout.html"
        >

          <img
            class="service-icon-img"
            src="assets/icons/cashout.png"
            alt="Cashout"
          >

          <span>
            Cashout
          </span>

        </a>


        <!-- Transfer Money -->
        <a
          class="service-card"
          href="transfer.html"
        >

          <img
            class="service-icon-img"
            src="assets/icons/transfer-money.png"
            alt="Transfer Money"
          >

          <span>
            Transfer Money
          </span>

        </a>


        <!-- Get Bonus -->
        <a
          class="service-card"
          href="bonus.html"
        >

          <img
            class="service-icon-img"
            src="assets/icons/get-bonus.png"
            alt="Get Bonus"
          >

          <span>
            Get Bonus
          </span>

        </a>


        <!-- Pay Bill -->
        <a
          class="service-card"
          href="pay-bill.html"
        >

          <img
            class="service-icon-img"
            src="assets/icons/pay-bill.png"
            alt="Pay Bill"
          >

          <span>
            Pay Bill
          </span>

        </a>


        <!-- Transactions -->
        <a
          class="service-card"
          href="transactions.html"
        >

          <img
            class="service-icon-img"
            src="assets/icons/transactions.png"
            alt="Transactions"
          >

          <span>
            Transactions
          </span>

        </a>

      </div>

    </section>


    <!-- ===================================================
         Transaction History
         =================================================== -->

    <section class="px-6 py-5">


      <!-- Section Header -->
      <div
        class="flex justify-between items-center mb-4"
      >

        <h2 class="text-lg font-bold">
          Transaction History
        </h2>

        <a
          class="text-sm text-slate-500"
          href="transactions.html"
        >
          View All
        </a>

      </div>


      <!-- Transaction List -->
      <div
        id="homeTransactions"
        class="space-y-3"
      ></div>

    </section>


    <!-- ===================================================
         Mobile Bottom Navigation
         =================================================== -->

    <nav class="mobile-nav">


      <!-- Home -->
      <a
        class="active"
        href="home.html"
      >
        ⌂
        <span>
          Home
        </span>
      </a>


      <!-- History -->
      <a href="transactions.html">
        ▤
        <span>
          History
        </span>
      </a>


      <!-- Bonus -->
      <a href="bonus.html">
        ★
        <span>
          Bonus
        </span>
      </a>


      <!-- Logout -->
      <a
        href="index.html"
        id="navLogout"
      >
        ⇥
        <span>
          Logout
        </span>
      </a>

    </nav>

  </main>


  <!-- =====================================================
       Shared Application JavaScript
       ===================================================== -->

  <script src="js/app.js"></script>


  <!-- =====================================================
       Home Page JavaScript
       ===================================================== -->

  <script src="js/home.js"></script>

</body>

</html>
