<!DOCTYPE html>
<html lang="en">

<head>

  <!-- =====================================================
       Document Metadata
       ===================================================== -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Payoo - Transactions</title>


  <!-- =====================================================
       DaisyUI
       ===================================================== -->

  <link
    href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css"
    rel="stylesheet"
  >


  <!-- =====================================================
       Tailwind CSS
       ===================================================== -->

  <script src="https://cdn.tailwindcss.com"></script>


  <!-- =====================================================
       Custom CSS
       ===================================================== -->

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body class="bg-slate-100">

  <!-- =====================================================
       Main Application Container
       ===================================================== -->

  <main
    class="phone-shell min-h-screen mx-auto max-w-md bg-slate-100 shadow-xl overflow-hidden"
  >


    <!-- ===================================================
         Page Header
         =================================================== -->

    <header class="page-header">

      <!-- Back Button -->
      <a
        href="home.html"
        class="back-btn"
        aria-label="Go back to home"
      >
        ←
      </a>


      <!-- Page Title -->
      <h1>
        Transactions
      </h1>


      <!-- Header Spacer -->
      <span></span>

    </header>


    <!-- ===================================================
         Transaction Section
         =================================================== -->

    <section class="px-6 py-6">


      <!-- =================================================
           Transaction Filters
           ================================================= -->

      <div
        class="flex gap-2 mb-5"
        role="group"
        aria-label="Transaction filters"
      >

        <!-- All Transactions -->
        <button
          type="button"
          class="filter-btn active"
          data-filter="all"
        >
          All
        </button>


        <!-- Credit Transactions -->
        <button
          type="button"
          class="filter-btn"
          data-filter="credit"
        >
          Money In
        </button>


        <!-- Debit Transactions -->
        <button
          type="button"
          class="filter-btn"
          data-filter="debit"
        >
          Money Out
        </button>

      </div>


      <!-- =================================================
           Transaction List
           ================================================= -->

      <div
        id="transactionList"
        class="space-y-3"
      ></div>

    </section>

  </main>


  <!-- =====================================================
       Shared Application JavaScript
       ===================================================== -->

  <script src="js/app.js"></script>


  <!-- =====================================================
       Transaction JavaScript
       ===================================================== -->

  <script src="js/transactions.js"></script>

</body>

</html>
